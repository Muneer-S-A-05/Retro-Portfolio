<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Retro Portfolio</title>
    <script src="./scripts/script.js" defer></script>
</head>
<body>
    <div class="mainWindow">
        <div class="titlebar">
            <div class="buttons">
                <div class="butt red"></div>
                <div class="butt yellow"></div>
                <div class="butt green"></div>
            </div>
            <div class="dragarea"><!--Retro Portfolio by Muneer S A--></div>
            <div class="timedate">
                    <img src="./icons/battery.svg">
                    <div id="date"></div>
                    <div id="time"></div>
            </div>
        </div>
        <div class="main">
            <div class="row">
                <div class="desktop-item"><img src="./icons/folder.png">My Computer</div>
                <div class="desktop-item"><img src="./icons/folder.png">Favourite Projects</div>
                <div class="desktop-item"><img src="./icons/folder.png">T-shirts</div>
            </div>
            <div class="row">
                <div class="desktop-item"><img src="./icons/folder.png">Clients</div>
                <div class="desktop-item"><img src="./icons/folder.png">Recycle Bin</div>
            </div>
        </div>
        <div class="toolbar-area">
            <div class="toolbar">
                <img src="./icons/bag.svg">
                <img src="./icons/shirt.svg">
                <img src="./icons/pen.svg">
                <img src="./icons/cam.svg">
                <img src="./icons/video.svg">
            </div>
        </div>
    </div>
</body>
</html>
